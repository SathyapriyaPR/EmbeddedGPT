<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EmbeddedGPT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>EmbeddedGPT</h1>

        <p>AI-Powered Datasheet Assistant for Embedded Engineers</p>

        <h2>📄 Upload Datasheet</h2>

         <input type="file" accept=".pdf" id="pdfFile">

        <h2>❓ Ask a Question</h2>

        
            <input
    type="text"
    id="question"
    placeholder="Example: What is the operating voltage of the ESP32?">

        <button id="askButton">Ask</button>
        

        <h2>💡 Answer</h2>

        <textarea
    id="answer"
    rows="8"
    placeholder="The AI's answer will appear here..."
    readonly></textarea>

    </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script src="script.js?v=2"></script>

</body>

</html>
